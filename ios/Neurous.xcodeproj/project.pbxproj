			shellScript = "# Hermes dSYM 파일을 찾아서 아카이브 폴더로 복사하는 스크립트\nset -e\n\n# dSYM 폴더가 없으면 생성\nif [ ! -d \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}\" ]; then\n  mkdir -p \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}\"\nfi\n\n# hermes.framework.dSYM 찾기\nHERMES_DSYM_PATH=\"${PODS_ROOT}/hermes-engine/destroot/hermes.framework.dSYM\"\nif [ -d \"${HERMES_DSYM_PATH}\" ]; then\n  echo \"Found hermes.framework.dSYM at ${HERMES_DSYM_PATH}\"\n  cp -R \"${HERMES_DSYM_PATH}\" \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/\"\n  echo \"Copied hermes.framework.dSYM\"\nelse\n  # 대체 경로 시도\n  ALTERNATIVE_PATH=$(find \"${PODS_ROOT}/hermes-engine\" -name \"hermes.framework.dSYM\" -type d | head -1)\n  if [ -n \"${ALTERNATIVE_PATH}\" ]; then\n    echo \"Found hermes.framework.dSYM at alternative path: ${ALTERNATIVE_PATH}\"\n    cp -R \"${ALTERNATIVE_PATH}\" \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/\"\n    echo \"Copied hermes.framework.dSYM from alternative path\"\n  fi\nfi\n\n# hermesvm.framework.dSYM 찾기 (최신 React Native)\nHERMESVM_DSYM_PATH=\"${PODS_ROOT}/hermes-engine/destroot/hermesvm.framework.dSYM\"\nif [ -d \"${HERMESVM_DSYM_PATH}\" ]; then\n  echo \"Found hermesvm.framework.dSYM at ${HERMESVM_DSYM_PATH}\"\n  cp -R \"${HERMESVM_DSYM_PATH}\" \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/\"\n  echo \"Copied hermesvm.framework.dSYM\"\nelse\n  # 대체 경로 시도\n  ALTERNATIVE_VM_PATH=$(find \"${PODS_ROOT}/hermes-engine\" -name \"hermesvm.framework.dSYM\" -type d | head -1)\n  if [ -n \"${ALTERNATIVE_VM_PATH}\" ]; then\n    echo \"Found hermesvm.framework.dSYM at alternative path: ${ALTERNATIVE_VM_PATH}\"\n    cp -R \"${ALTERNATIVE_VM_PATH}\" \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/\"\n    echo \"Copied hermesvm.framework.dSYM from alternative path\"\n  else\n    # React Native의 기본 경로에서 찾기\n    RN_HERMES_PATH=\"${PODS_ROOT}/../node_modules/react-native/sdks/hermes\"\n    if [ -d \"${RN_HERMES_PATH}\" ]; then\n      RN_HERMESVM_DSYM=$(find \"${RN_HERMES_PATH}\" -name \"hermesvm.framework.dSYM\" -type d | head -1)\n      if [ -n \"${RN_HERMESVM_DSYM}\" ]; then\n        echo \"Found hermesvm.framework.dSYM at React Native path: ${RN_HERMESVM_DSYM}\"\n        cp -R \"${RN_HERMESVM_DSYM}\" \"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/\"\n        echo \"Copied hermesvm.framework.dSYM from React Native path\"\n      fi\n    fi\n  fi\nfi\n\necho \"Hermes dSYM copy completed\"\n";
		};
