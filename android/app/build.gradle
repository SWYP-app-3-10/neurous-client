apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// react-native-svg를 위한 설정
rootProject.ext.REACT_NATIVE_NODE_MODULES_DIR = rootProject.projectDir.toString() + "/../node_modules/react-native"

react {
    autolinkLibrariesWithApp()
}

// Naver Login SDK가 release minify(ProGuard/R8) 환경에서
// java.lang.ClassCastException: Class cannot be cast to ParameterizedType
// 오류를 발생시켜 내부테스트 로그인 실패가 발생함.
//
// 로그인 안정성을 우선하기 위해 현재 release ProGuard/R8 비활성화.
// 추후 소셜 로그인 SDK keep rule 안정화 후 재활성화 검토 예정.
def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "io.neurous.app"
    defaultConfig {
        applicationId "io.neurous.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 45 // 45, 2026-06-28 12:04
        versionName "1.0.45"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // keystore = file(./neuros-app.keystore)
            // ../gradle.properties에서 참조
            storeFile file(NEUROUS_RELEASE_STORE_FILE)
            storePassword NEUROUS_RELEASE_STORE_PASSWORD
            keyAlias NEUROUS_RELEASE_KEY_ALIAS
            keyPassword NEUROUS_RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release

            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Firebase BOM: 모든 Firebase 라이브러리 버전을 일괄 관리
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    // FCM(Firebase Cloud Messaging): 디바이스 푸시 알림 수신
    implementation 'com.google.firebase:firebase-messaging'
}
